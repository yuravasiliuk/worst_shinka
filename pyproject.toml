[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worst-shinka"
version = "0.0.0"
description = "CLI shell for the Worst Shinka evolution infrastructure"
requires-python = ">=3.10"
dependencies =[]

[project.scripts]
worst-shinka = "worst_shinka.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["worst_shinka"]

[tool.pytest.ini_options]
testpaths = ["Tests"]

